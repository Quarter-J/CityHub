<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记详情 - CityHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header"></header>

  <div class="page-container">
    <div class="card" id="blogContent">
      <div class="card-body">
        <div class="loading">加载中</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-body">
        <div class="section-title" style="margin-bottom:12px;">
          <h2>点赞用户</h2>
        </div>
        <div id="likesList" style="display:flex;gap:16px;flex-wrap:wrap;"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-body">
        <div class="section-title" style="margin-bottom:12px;">
          <h2>评论 <span id="commentCount" style="font-size:13px;color:var(--text-light);font-weight:400;"></span></h2>
        </div>
        <div style="display:flex;gap:10px;margin-bottom:20px;">
          <textarea id="commentInput" class="form-control" rows="2" placeholder="说说你的想法..." style="flex:1;resize:none;"></textarea>
          <button class="btn btn-primary" onclick="submitComment()" style="align-self:flex-end;">发表</button>
        </div>
        <div id="commentList"></div>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script>
    const blogId = new URLSearchParams(window.location.search).get('id')

    function loadBlog() {
      const body = document.querySelector('#blogContent .card-body')
      if (!blogId) {
        body.innerHTML = '<div class="empty-state"><p>笔记ID不存在</p></div>'
        return
      }

      blogAPI.detail(blogId)
        .then((res) => {
          const blog = res.data
          if (!blog) {
            body.innerHTML = '<div class="empty-state"><p>笔记不存在</p></div>'
            return
          }

          const images = blog.images ? blog.images.split(',') : []
          const imgHtml = images.length
            ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:16px 0;">
                ${images.map((img) => `<img src="${img}" style="width:100%;height:220px;object-fit:cover;border-radius:12px;" onerror="this.style.display='none'">`).join('')}
              </div>`
            : ''

          body.innerHTML = `
            <div class="blog-header" style="cursor:pointer;" onclick="window.location.href='user.html?id=${blog.userId}'">
              <img class="blog-avatar" src="${blog.icon || 'https://via.placeholder.com/40x40'}" alt="">
              <div>
                <div class="blog-user">${blog.name || '匿名用户'}</div>
                <div class="blog-time">${formatTime(blog.createTime)}</div>
              </div>
            </div>
            <h1 style="font-size:24px;font-weight:800;margin:18px 0;letter-spacing:-0.4px;line-height:1.4;">${blog.title}</h1>
            <div style="font-size:15px;color:var(--text-secondary);line-height:1.9;word-break:break-word;">${blog.content}</div>
            ${imgHtml}
            ${blog.shopId ? `<div style="margin-top:16px;padding:14px;background:var(--bg-subtle);border-radius:12px;display:flex;align-items:center;gap:8px;">
              <span style="font-size:13px;color:var(--text-secondary);">${icon('pin')} 关联商家</span>
              <a href="shop-detail.html?id=${blog.shopId}" style="color:var(--primary);font-size:13px;font-weight:600;">查看商家 ${icon('arrow-right')}</a>
            </div>` : ''}
            <div class="blog-actions" style="margin-top:20px;">
              <span aria-label="点赞" class="blog-action ${blog.isLike ? 'liked' : ''}" id="likeAction" onclick="toggleLike()" style="font-size:15px;">
                ${icon('heart')} <span id="likeCount">${blog.liked || 0}</span>
              </span>
            </div>
          `
        })
        .catch((err) => {
          body.innerHTML = `<div class="empty-state"><p>${err.message}</p></div>`
        })
    }

    function toggleLike() {
      if (!requireAuth()) return
      blogAPI.like(blogId)
        .then(() => {
          const action = document.getElementById('likeAction')
          const count = document.getElementById('likeCount')
          const isLiked = action.classList.contains('liked')
          if (isLiked) {
            action.classList.remove('liked')
            action.innerHTML = `${icon('heart')} <span id="likeCount">${parseInt(count.textContent) - 1}</span>`
          } else {
            action.classList.add('liked')
            action.innerHTML = `${icon('heart')} <span id="likeCount">${parseInt(count.textContent) + 1}</span>`
          }
        })
        .catch((err) => showToast(err.message, 'error'))
    }

    function loadLikes() {
      const container = document.getElementById('likesList')
      blogAPI.likes(blogId)
        .then((res) => {
          const users = res.data || []
          if (!users.length) {
            container.innerHTML = '<span style="color:var(--text-light);font-size:14px;">暂无点赞</span>'
            return
          }
          container.innerHTML = users.map((u) => `
            <div style="text-align:center;cursor:pointer;" onclick="window.location.href='user.html?id=${u.id}'">
              <img src="${u.icon || 'https://via.placeholder.com/40x40'}"
                   style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--border);">
              <div style="font-size:12px;color:var(--text-light);margin-top:4px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${u.nickName || u.name || '用户'}</div>
            </div>
          `).join('')
        })
        .catch(() => {})
    }

    function loadComments() {
      const container = document.getElementById('commentList')
      commentAPI.list(blogId, 1)
        .then((res) => {
          const comments = res.data || []
          document.getElementById('commentCount').textContent = res.total ? `（共 ${res.total} 条）` : ''
          if (!comments.length) {
            container.innerHTML = '<div class="empty-state"><p>暂无评论，快来抢沙发~</p></div>'
            return
          }
          const me = getUser()
          container.innerHTML = comments.map((c) => {
            const isMine = me && String(me.id) === String(c.userId)
            return `<div class="comment-item">
              <img class="comment-avatar" src="${c.icon || 'https://via.placeholder.com/40x40'}">
              <div class="comment-body">
                <div class="comment-head">
                  <span class="comment-name">${c.name || '匿名用户'}</span>
                  <span class="comment-time">${formatTime(c.createTime)}</span>
                </div>
                <div class="comment-text">${c.content}</div>
                ${isMine ? `<a href="javascript:void(0)" class="comment-delete" onclick="deleteComment(${c.id})">删除</a>` : ''}
              </div>
            </div>`
          }).join('')
        })
        .catch(() => {
          container.innerHTML = '<div class="empty-state"><p>评论加载失败</p></div>'
        })
    }

    function submitComment() {
      if (!requireAuth()) return
      const content = document.getElementById('commentInput').value.trim()
      if (!content) { showToast('请输入评论内容', 'error'); return }

      commentAPI.add({ blogId: parseInt(blogId), content })
        .then(() => {
          document.getElementById('commentInput').value = ''
          showToast('评论成功', 'success')
          loadComments()
        })
        .catch((err) => showToast(err.message || '评论失败', 'error'))
    }

    function deleteComment(id) {
      if (!confirm('确定删除这条评论吗？')) return
      commentAPI.remove(id)
        .then(() => {
          showToast('已删除', 'success')
          loadComments()
        })
        .catch((err) => showToast(err.message || '删除失败', 'error'))
    }

    function init() {
      renderHeader()
      loadBlog()
      loadLikes()
      loadComments()
    }

    init()
  </script>
</body>
</html>
