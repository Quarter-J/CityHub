  server:
    port: 8081
  spring:
    rabbitmq:
      host: ${RABBITMQ_HOST:127.0.0.1}
      port: ${RABBITMQ_PORT:5672}
      username: ${RABBITMQ_USERNAME:guest}
      password: ${RABBITMQ_PASSWORD:guest}
      publisher-confirm-type: correlated
      publisher-returns: true
      listener:
        simple:
          default-requeue-rejected: false
          retry:
            enabled: true
            max-attempts: 3
            initial-interval: 500ms
            multiplier: 2
            max-interval: 2s
    application:
      name: hmdp
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/dingping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          time-between-eviction-runs: 10s
    jackson:
      default-property-inclusion: non_null # JSON处理时忽略非空字段
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB
  mybatis-plus:
    type-aliases-package: com.hmdp.entity # 别名扫描包
  logging:
    level:
      com.hmdp: debug
  auth:
    jwt:
      secret: ${JWT_SECRET:cityhub-development-secret-change-me-2026}
      ttl-minutes: ${JWT_TTL_MINUTES:30}
  order:
    timeout-minutes: ${ORDER_TIMEOUT_MINUTES:15}
